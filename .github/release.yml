# 自动生成的 Release Notes 配置
# 参考：https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - octocat
  categories:
    - title: 🚀 新功能
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug 修复
      labels:
        - bug
        - fix
    - title: ⚡ 性能优化
      labels:
        - performance
    - title: 📚 文档更新
      labels:
        - documentation
        - docs
    - title: 🔧 其他更新
      labels:
        - "*"
